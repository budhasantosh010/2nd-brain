[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "global-second-brain"
version = "0.1.0"
description = "Local-first AI-powered Global Second Brain engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Santosh Budha"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "charset-normalizer>=3.3",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "psutil>=6.0",
  "python-docx>=1.1",
  "python-frontmatter>=1.1",
  "python-pptx>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "watchdog>=5.0",
  "openpyxl>=3.1",
  "mcp>=1.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
gemini = ["google-genai>=1.0"]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "types-psutil>=7.0",
]

[project.scripts]
second-brain = "second_brain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["second_brain"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
